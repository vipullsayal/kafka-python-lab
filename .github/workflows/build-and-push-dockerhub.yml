name: Build and push producer/consumer to Docker Hub

on:
  push:
    branches: ["main"]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push producer
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/kafka-producer:latest ./producer
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/kafka-producer:latest

      - name: Build and push consumer
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/kafka-consumer:latest ./consumer
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/kafka-consumer:latest
